spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${DB_USER:banking}
    password: ${DB_PASSWORD:banking}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: data-processor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Used only to publish failed records to the <topic>.DLT dead-letter topics.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      concurrency: 3

processor:
  topics:
    interests: interests-validated
    transactions: transactions-validated
    annual-accounts: annual-accounts-validated
    rejected: ingestion-rejected
  # Annual rate applied to the balance of each product type.
  interest-rates:
    ahorro: 0.025
    hipoteca: 0.065
    prestamo: 0.12
