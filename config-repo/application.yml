# Shared configuration served by config-server to every client service.
# Placeholders (${...}) are resolved on the client side, so each container
# can override them through environment variables.

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

spring:
  cloud:
    loadbalancer:
      # Pick up instances that (re)registered in Eureka quickly.
      cache:
        ttl: 10s
  # Every resource server validates JWTs against the auth-server public keys.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVER_URL:http://localhost:9000}/oauth2/jwks

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
