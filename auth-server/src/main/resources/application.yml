server:
  port: ${SERVER_PORT:9000}

spring:
  application:
    name: auth-server
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  security:
    oauth2:
      authorizationserver:
        # Fixed issuer so tokens are identical whether requested through the
        # gateway, from the host, or from inside the Docker network.
        issuer: ${AUTH_ISSUER:http://auth-server:9000}

# Clients allowed to use the Client Credentials grant (see SecurityConfig).
auth:
  token-ttl: ${AUTH_TOKEN_TTL:PT30M}
  clients:
    - client-id: ${BANKING_CLIENT_ID:banking-client}
      client-secret: ${BANKING_CLIENT_SECRET:banking-secret}
      scopes: [ data.read, ingestion.write ]
    - client-id: ${RESILIENT_CLIENT_ID:resilient-client}
      client-secret: ${RESILIENT_CLIENT_SECRET:resilient-secret}
      scopes: [ data.read ]
